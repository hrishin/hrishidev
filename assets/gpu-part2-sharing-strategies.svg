<svg
  width="1200"
  height="630"
  viewBox="0 0 1200 630"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-labelledby="gpu2-diagram-title gpu2-diagram-desc"
  font-family="'Helvetica Neue', Arial, sans-serif"
>
  <title id="gpu2-diagram-title">Five ways to share a single GPU across Kubernetes workloads</title>
  <desc id="gpu2-diagram-desc">
    A comparison of five GPU sharing strategies: Time-Slicing, MPS, MIG, HAMi, and vGPU,
    each trading isolation strength against setup complexity differently.
  </desc>

  <rect x="0" y="0" width="1200" height="630" fill="#f8fafc" />

  <text x="60" y="72" font-size="30" font-weight="700" fill="#0f172a">
    GPU from Silicon to Container
  </text>
  <text x="60" y="104" font-size="18" fill="#475569">
    Part 2: five ways to split one GPU across workloads
  </text>

  <g font-size="14" font-weight="600">
    <!-- 1 Time-Slicing -->
    <rect x="40" y="180" width="200" height="220" rx="14" fill="#fff7ed" stroke="#f97316" stroke-width="2" />
    <circle cx="66" cy="208" r="15" fill="#f97316" />
    <text x="66" y="213" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
    <text x="86" y="213" fill="#0f172a" font-size="14">Time-Slicing</text>
    <text x="58" y="245" font-size="12.5" font-weight="400" fill="#475569">Contexts round-robin</text>
    <text x="58" y="263" font-size="12.5" font-weight="400" fill="#475569">the same SM cores</text>
    <text x="58" y="295" font-size="11.5" font-weight="400" fill="#94a3b8">No memory isolation</text>
    <text x="58" y="313" font-size="11.5" font-weight="400" fill="#94a3b8">Simplest to configure</text>

    <!-- 2 MPS -->
    <rect x="270" y="180" width="200" height="220" rx="14" fill="#f0f9ff" stroke="#38bdf8" stroke-width="2" />
    <circle cx="296" cy="208" r="15" fill="#38bdf8" />
    <text x="296" y="213" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
    <text x="316" y="213" fill="#0f172a" font-size="14">MPS</text>
    <text x="288" y="245" font-size="12.5" font-weight="400" fill="#475569">Concurrent kernel</text>
    <text x="288" y="263" font-size="12.5" font-weight="400" fill="#475569">execution, shared context</text>
    <text x="288" y="295" font-size="11.5" font-weight="400" fill="#94a3b8">No hard memory limits</text>
    <text x="288" y="313" font-size="11.5" font-weight="400" fill="#94a3b8">One faulty client can crash MPS</text>

    <!-- 3 MIG -->
    <rect x="500" y="180" width="200" height="220" rx="14" fill="#faf5ff" stroke="#a78bfa" stroke-width="2" />
    <circle cx="526" cy="208" r="15" fill="#a78bfa" />
    <text x="526" y="213" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
    <text x="546" y="213" fill="#0f172a" font-size="14">MIG</text>
    <text x="518" y="245" font-size="12.5" font-weight="400" fill="#475569">Hardware-partitioned</text>
    <text x="518" y="263" font-size="12.5" font-weight="400" fill="#475569">GPU instances</text>
    <text x="518" y="295" font-size="11.5" font-weight="400" fill="#94a3b8">True fault isolation</text>
    <text x="518" y="313" font-size="11.5" font-weight="400" fill="#94a3b8">Fixed profiles, Ampere+ only</text>

    <!-- 4 HAMi -->
    <rect x="730" y="180" width="200" height="220" rx="14" fill="#f0fdf4" stroke="#22c55e" stroke-width="2" />
    <circle cx="756" cy="208" r="15" fill="#22c55e" />
    <text x="756" y="213" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
    <text x="776" y="213" fill="#0f172a" font-size="14">HAMi</text>
    <text x="748" y="245" font-size="12.5" font-weight="400" fill="#475569">Software-enforced</text>
    <text x="748" y="263" font-size="12.5" font-weight="400" fill="#475569">fractional quotas</text>
    <text x="748" y="295" font-size="11.5" font-weight="400" fill="#94a3b8">No hardware repartitioning</text>
    <text x="748" y="313" font-size="11.5" font-weight="400" fill="#94a3b8">Third-party scheduler add-on</text>

    <!-- 5 vGPU -->
    <rect x="960" y="180" width="200" height="220" rx="14" fill="#fff7ed" stroke="#f97316" stroke-width="2" />
    <circle cx="986" cy="208" r="15" fill="#f97316" />
    <text x="986" y="213" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
    <text x="1006" y="213" fill="#0f172a" font-size="14">vGPU</text>
    <text x="978" y="245" font-size="12.5" font-weight="400" fill="#475569">Hypervisor-mediated</text>
    <text x="978" y="263" font-size="12.5" font-weight="400" fill="#475569">virtual GPU devices</text>
    <text x="978" y="295" font-size="11.5" font-weight="400" fill="#94a3b8">Strong isolation</text>
    <text x="978" y="313" font-size="11.5" font-weight="400" fill="#94a3b8">Needs NVIDIA licensing</text>
  </g>

  <text x="60" y="580" font-size="13" fill="#94a3b8">hrishi.dev</text>
  <text x="1140" y="580" font-size="13" fill="#94a3b8" text-anchor="end">Isolation strength increases left to right, roughly</text>

  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#94a3b8" />
    </marker>
  </defs>
</svg>
